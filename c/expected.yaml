# line      Zeile der Schwachstelle (ein Treffer zählt bei +/- tolerance Zeilen)
# category  Art der Schwachstelle, siehe CATEGORY_KEYWORDS in scripts/evaluate_fixtures.py
# contains  Textausschnitt der Zeile; tests/test_fixtures.py prüft damit, dass
#           Zeilennummern und Code synchron bleiben
# findings: []  -> Datei ist sicher, jedes Finding ist ein Fehlalarm

