# Erwartete Findings für die FalconEYE-Testdateien.
#
# Die Testdateien enthalten absichtlich KEINE Hinweiskommentare und neutrale
# Dateinamen, damit das LLM die Lücken nicht über Beschriftungen "findet".
# Diese Datei wird von FalconEYE nicht gescannt.
